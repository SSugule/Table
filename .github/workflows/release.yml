name: Build APK, Auto-Version & Release

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Calculate and Bump Version
        id: versioning
        run: |
          chmod +x scripts/bump-version.js scripts/test-version.js || true
          node scripts/test-version.js
          node scripts/bump-version.js

      - name: Ensure Gradlew is Executable
        run: chmod +x ./gradlew || true

      - name: Run Unit Tests
        run: |
          echo "Running unit tests and verification..."
          ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build Android APK
        run: |
          echo "Compiling APK..."
          # Build release if keystore is present, otherwise assembleDebug
          KEYSTORE_FILE="${KEYSTORE_PATH:-my-upload-key.jks}"
          if [ -f "$KEYSTORE_FILE" ]; then
            echo "Release keystore detected ($KEYSTORE_FILE), running assembleRelease..."
            ./gradlew assembleRelease
          else
            echo "No custom release keystore found, compiling with assembleDebug..."
            ./gradlew assembleDebug
          fi

      - name: Prepare APK Asset for Release
        id: prepare_asset
        run: |
          NEW_VER="${{ steps.versioning.outputs.new_version }}"
          mkdir -p release-artifacts

          # Locate generated APK (prefer release over debug)
          APK_PATH=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found after build!"
            exit 1
          fi

          TARGET_APK="release-artifacts/DutySchedule_v${NEW_VER}.apk"
          cp "$APK_PATH" "$TARGET_APK"
          echo "apk_path=$TARGET_APK" >> $GITHUB_OUTPUT
          echo "apk_filename=DutySchedule_v${NEW_VER}.apk" >> $GITHUB_OUTPUT
          ls -lh "$TARGET_APK"

      - name: Commit Version Bump and Tag
        run: |
          NEW_VER="${{ steps.versioning.outputs.new_version }}"
          TAG="v${NEW_VER}"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json app/build.gradle.kts
          git commit -m "chore(release): bump version to ${NEW_VER} [skip ci]" || echo "No changes to commit"
          git tag -f "$TAG"
          git push origin HEAD:${{ github.ref_name }} --tags || git push origin --tags || echo "Push skipped or branch protected"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: "Release ${{ steps.versioning.outputs.tag_name }}"
          make_latest: true
          body: |
            ## 🚀 Monarchy: Eternal Reign — График Нарядов и Дежурств
            
            **Версия:** `${{ steps.versioning.outputs.new_version }}`
            
            ### Изменения в релизе:
            - Исправлен Unit-тест доступности кандидатов в DutyRulesEngineTest
            - Графа отпуска «Ближайший» для исключения наложения дежурств
            - Настройки приоритета постов для дежурных (например, Джумагазиев ВГ2)
            - Кнопки добавления людей с выходного и отсыпного дней (наказания/внеочередные наряды)
            - Автоматическая сборка APK через GitHub Actions
            
            ### Файлы для установки:
            - **${{ steps.prepare_asset.outputs.apk_filename }}** (установочный APK файл для Android)
          files: |
            ${{ steps.prepare_asset.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
